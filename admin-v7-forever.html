<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>.sub.active{background:#1a204f!important;border-color:#8b5cf6!important;color:white}</style>
<script>
const CF_API = "https://silent-term-1b1a.riasdeath77.workers.dev/api/prices";
const PRICE_KEY = "Gear2024!";
async function saveToCloudflare(){
  updatePreview();
  let currentForever = JSON.parse(document.getElementById('preview').value).forever;
  document.getElementById('status').innerText='☁️ Subiendo FOREVER...';
  try{
    let resCloud = await fetch(CF_API).then(r=>r.json()).catch(()=>({}));
    let base = resCloud.retail? resCloud : {retail:{}, forever:{}, leveling:resCloud.leveling, gold:resCloud.gold};
    let merged = {...base, retail: base.retail, forever: currentForever, leveling: base.leveling, gold: base.gold};
    let res = await fetch(CF_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:PRICE_KEY,data:merged})});
    let j=await res.json();
    if(j.ok){ document.getElementById('status').innerText='✅ EN VIVO! Forever actualizado'; alert("✅ FOREVER en vivo!"); }
    else{ alert("Error: "+(j.error||'no admin')); }
  }catch(e){ alert(e.message); }
}
</script>

function renderGeneric(key,container,status){
 let cat=data.forever[key];
 if(!cat.names) cat.names={};
 document.getElementById(container).innerHTML=Object.keys(cat.prices).map(id=>`<div class="flex gap-2 items-center bg-[#0a0e28] border border-[#1e254a] rounded-xl p-2"><input id="f-${key}-name-${id}" value="${cat.names[id]||id}" class="flex-1 bg-[#111536] border rounded-lg px-2 py-2 text-[10px]" oninput="updatePreview()"><input id="f-${key}-price-${id}" value="${cat.prices[id]}" type="number" step="0.01" class="w-[90px] bg-[#111536] border rounded-lg px-2 py-2 text-[11px] font-bold" oninput="updatePreview()"></div>`).join('');
 if(document.getElementById(status)) document.getElementById(status).innerText='✅ '+key+' listo';
}

function toggleBlock(id,checked){
 if(checked){ if(!data.forever.dungeon.blocked.includes(id)) data.forever.dungeon.blocked.push(id); }
 else{ data.forever.dungeon.blocked=data.forever.dungeon.blocked.filter(x=>x!==id); }
 renderAll();
}
function toggleBlockRaid(id,checked){
 if(checked){ if(!data.forever.raid.blocked.includes(id)) data.forever.raid.blocked.push(id); }
 else{ data.forever.raid.blocked=data.forever.raid.blocked.filter(x=>x!==id); }
 renderAll();
}
function toggleBlockPvp(id,checked){
 if(checked){ if(!data.forever.pvp.blocked.includes(id)) data.forever.pvp.blocked.push(id); }
 else{ data.forever.pvp.blocked=data.forever.pvp.blocked.filter(x=>x!==id); }
 renderAll();
}
function blockAllNew(){ DUNGEONS.forEach(d=>{ if(d.new &&!data.forever.dungeon.blocked.includes(d.id)) data.forever.dungeon.blocked.push(d.id); }); renderAll(); }
function clearBlocks(){ data.forever.dungeon.blocked=[]; renderAll(); }
function blockAllHighPvp(){ [4,5,6,7,8,9,10,11].forEach(id=>{ if(!data.forever.pvp.blocked.includes(id)) data.forever.pvp.blocked.push(id); }); renderAll(); }
function clearBlocksPvp(){ data.forever.pvp.blocked=[]; renderAll(); }

function updatePreview(){
 let out={forever:{
   dungeon:{prices:{}, percents:{}, blocked:[]},
   raid:{prices:{}, names:{}, percents:{}, blocked:[]},
   pvp:{prices:{}, names:{}, percents:{}, blocked:[]}
 }};
 DUNGEONS.forEach(d=>{ let el=document.getElementById('price-'+d.id); if(el) out.forever.dungeon.prices[d.id]=parseFloat(el.value)||0; });
 out.forever.dungeon.percents={
  selfplay:parseInt(document.getElementById('f-selfplay')?.value||0),
  pilot:parseInt(document.getElementById('f-pilot')?.value||0),
  remote:parseInt(document.getElementById('f-remote')?.value||30)
 };
 out.forever.dungeon.blocked=[...data.forever.dungeon.blocked].sort((a,b)=>a-b);

 RAIDS.forEach(r=>{
  let ep=document.getElementById(`f-raid-price-${r.id}`);
  let en=document.getElementById(`f-raid-name-${r.id}`);
  if(ep) out.forever.raid.prices[r.id]=parseFloat(ep.value)||0;
  if(en) out.forever.raid.names[r.id]=en.value;
 });
 out.forever.raid.percents={
  selfplay:parseInt(document.getElementById('f-raid-selfplay')?.value||0),
  pilot:parseInt(document.getElementById('f-raid-pilot')?.value||0),
  remote:parseInt(document.getElementById('f-raid-remote')?.value||30)
 };
 out.forever.raid.blocked=[...data.forever.raid.blocked].sort((a,b)=>a-b);

 PVP.forEach(p=>{
  let ep=document.getElementById(`f-pvp-price-${p.id}`);
  let en=document.getElementById(`f-pvp-name-${p.id}`);
  if(ep) out.forever.pvp.prices[p.id]=parseFloat(ep.value)||0;
  if(en) out.forever.pvp.names[p.id]=en.value;
 });
 out.forever.pvp.prices.honor_rate=parseFloat(document.getElementById('f-pvp-honor-rate')?.value||0.8);
 out.forever.pvp.percents={
  selfplay:parseInt(document.getElementById('f-pvp-selfplay')?.value||0),
  pilot:parseInt(document.getElementById('f-pvp-pilot')?.value||0),
  remote:parseInt(document.getElementById('f-pvp-remote')?.value||30)
 };
 out.forever.pvp.blocked=[...data.forever.pvp.blocked].sort((a,b)=>a-b);

 document.getElementById('preview').value=JSON.stringify(out,null,2);
}

function saveAll(){
 updatePreview();
 let txt=document.getElementById('preview').value;
 let blob=new Blob([txt],{type:'application/json'});
 let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='price-forever.json'; a.click();
 document.getElementById('status').innerText='✅ Guardado! Sube el JSON';
}
init();
</script>
