<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - Órdenes | GEARHAVEN</title>
<link rel="icon" type="image/png" href="./imagenes/favicon.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Arial;background:#0a0e28;color:#fff}body::before{content:'';position:fixed;inset:0;background:url('./imagenes/fondouno.jpg') center/cover no-repeat;opacity:0.05;pointer-events:none;z-index:-1}</style>
</head>
<body class="p-4 md:p-6">
<div class="max-w-[1150px] mx-auto">
<div class="flex justify-between items-center mb-6 flex-wrap gap-2">
  <h1 class="text-[22px] font-black">🔐 ADMIN - Gestión de Pedidos <span id="kvStatus" class="text-[10px] bg-yellow-500 text-black px-2 py-1 rounded-full ml-2">Conectando KV...</span></h1>
  <div class="flex gap-2 flex-wrap">
    <button onclick="location.href='./index.html'" class="text-[11px] bg-[#1a204f] border border-[#2a3366] px-3 py-2 rounded-full">&#x2190; Tienda</button>
    <button onclick="location.href='./account.html'" class="text-[11px] bg-[#1a204f] border border-[#2a3366] px-3 py-2 rounded-full">&#x1F464; Account</button>
    <button onclick="loadAllOrders()" class="text-[11px] bg-[#8b5cf6] px-3 py-2 rounded-full font-bold">🔄 Recargar KV</button>
    <button onclick="clearAllKV()" class="text-[11px] bg-[#ef4444] px-3 py-2 rounded-full font-bold">&#x1F5D1;️ Limpiar TODO KV</button>
  </div>
</div>
<div class="grid grid-cols-2 md:grid-cols-6 gap-2 mb-6">
  <div class="bg-[#151a40] border border-[#2a3366] rounded-xl p-3 text-center"><div class="text-[9px] text-[#8b92c9]">TOTAL</div><div id="totalOrders" class="text-[20px] font-black">0</div></div>
  <div class="bg-[#151a40] border border-[#f59e0b]/30 rounded-xl p-3 text-center"><div class="text-[9px] text-[#f59e0b]">PENDIENTE</div><div id="pendingOrders" class="text-[20px] font-black text-[#f59e0b]">0</div></div>
  <div class="bg-[#151a40] border border-[#22c55e]/30 rounded-xl p-3 text-center"><div class="text-[9px] text-[#22c55e]">VERIFICADO</div><div id="verifiedOrders" class="text-[20px] font-black text-[#22c55e]">0</div></div>
  <div class="bg-[#151a40] border border-[#3b82f6]/30 rounded-xl p-3 text-center"><div class="text-[9px] text-[#3b82f6]">EN CURSO</div><div id="progressOrders" class="text-[20px] font-black text-[#3b82f6]">0</div></div>
  <div class="bg-[#151a40] border border-[#a855f7]/30 rounded-xl p-3 text-center"><div class="text-[9px] text-[#a855f7]">COMPLETADO</div><div id="completedOrders" class="text-[20px] font-black text-[#a855f7]">0</div></div>
  <div class="bg-[#151a40] border border-[#8b5cf6]/30 rounded-xl p-3 text-center"><div class="text-[9px] text-[#8b5cf6]">VENTAS USD</div><div id="totalSales" class="text-[16px] font-black">$0</div></div>
</div>
<div class="bg-[#111536] border border-[#1e254a] rounded-xl p-3 mb-4 flex flex-wrap gap-2 items-center">
  <input id="searchInput" oninput="renderOrders()" placeholder="&#x1F50D; Buscar ID, personaje, BattleTag, email, DUNGEON, MULTI..." class="flex-1 min-w-[180px] bg-[#0a0e28] border border-[#2a3366] rounded-lg px-3 py-2 text-[11px] outline-none">
  <select id="filterStatus" onchange="renderOrders()" class="bg-[#0a0e28] border border-[#2a3366] rounded-lg px-3 py-2 text-[11px]">
    <option value="all">Todos los estados</option>
    <option value="PENDING_VERIFICATION">&#x1F7E1; Pendiente Verificación</option>
    <option value="PENDING">&#x1F7E1; PENDING (cliente)</option>
    <option value="PAID_VERIFIED">&#x1F7E2; Pago Verificado</option>
    <option value="VERIFIED">✅ VERIFIED (Telegram)</option>
    <option value="REJECTED">❌ REJECTED (Telegram)</option>
    <option value="PAID">&#x1F7E2; PAID</option>
    <option value="IN_PROGRESS">&#x1F535; En Progreso</option>
    <option value="COMPLETED">✅ Completado</option>
    <option value="DELAYED">🟠 Retrasado</option>
    <option value="CANCELLED">&#x1F534; Cancelado</option>
    <option value="REFUNDED">⚫ Reembolsado</option>
  </select>
  <select id="filterType" onchange="renderOrders()" class="bg-[#0a0e28] border border-[#8b5cf6] rounded-lg px-3 py-2 text-[11px] font-bold">
    <option value="all">&#x1F4E6; Todos</option>
    <option value="single">&#x1F4E6; Singles</option>
    <option value="multi">&#x1F6D2; Canastas MULTI</option>
  </select>
  <button onclick="exportOrders()" class="bg-[#22c55e] text-black font-bold px-4 py-2 rounded-lg text-[10px]">📥 CSV</button>
</div>
<div id="ordersContainer" class="grid gap-3"></div>
<div id="emptyMsg" style="display:none" class="bg-[#151a40] border border-[#2a3366] rounded-xl p-10 text-center text-[#6b77b5] text-[12px]">No hay órdenes en Cloudflare KV.</div>
</div>
<script>
const ADMIN_PASS="gearhaven123";
if(localStorage.getItem('gearhaven_admin_auth')!=='ok'){
  let p=prompt('🔐 Contraseña Admin:'); if(p!==ADMIN_PASS){alert('Incorrecta'); location.href='./index.html';} else localStorage.setItem('gearhaven_admin_auth','ok');
}
const WORKER_URL="https://gearhaven-telegram.riasdeath77.workers.dev";
let allOrdersCache = [];
let mainImg=localStorage.getItem('bundle_main_img')||'./imagenes/favicon.jpg';

async function loadAllOrders(){
  document.getElementById('kvStatus').innerText="⏳ Cargando KV...";
  try{
    let res = await fetch(`${WORKER_URL}/api/orders`);
    let kvOrders = await res.json();
    if(!Array.isArray(kvOrders)) kvOrders=[];
    allOrdersCache = kvOrders.sort((a,b)=> new Date(b.date||0)-new Date(a.date||0));
    document.getElementById('kvStatus').innerText=`✅ KV: ${kvOrders.length} órdenes`;
    document.getElementById('kvStatus').className="text-[10px] bg-green-500 text-black px-2 py-1 rounded-full ml-2";
    renderOrders();
  }catch(e){
    document.getElementById('kvStatus').innerText="⚠️ Error KV";
    allOrdersCache = [];
    renderOrders();
  }
}
function getOrders(){ return allOrdersCache; }

const STATUS_CONFIG={
  PENDING_VERIFICATION:{label:'Pendiente',color:'bg-[#f59e0b] text-black',dot:'&#x1F7E1;'},
  PENDING:{label:'Pending',color:'bg-[#f59e0b] text-black',dot:'&#x1F7E1;'},
  PAID_VERIFIED:{label:'Verificado',color:'bg-[#22c55e] text-black',dot:'&#x1F7E2;'},
  VERIFIED:{label:'Verificado TG',color:'bg-[#22c55e] text-black',dot:'✅'},
  PAID:{label:'Paid',color:'bg-[#22c55e] text-black',dot:'&#x1F7E2;'},
  REJECTED:{label:'Rechazado TG',color:'bg-[#ef4444] text-white',dot:'❌'},
  IN_PROGRESS:{label:'En Curso',color:'bg-[#3b82f6] text-white',dot:'&#x1F535;'},
  COMPLETED:{label:'Completado',color:'bg-[#a855f7] text-white',dot:'✅'},
  DELAYED:{label:'Retrasado',color:'bg-[#f97316] text-black',dot:'🟠'},
  CANCELLED:{label:'Cancelado',color:'bg-[#ef4444] text-white',dot:'&#x1F534;'},
  REFUNDED:{label:'Reembolsado',color:'bg-[#6b7280] text-white',dot:'⚫'}
};

function renderOrders(){
  let orders=getOrders();
  let filter=document.getElementById('filterStatus').value;
  let typeFilter=document.getElementById('filterType').value;
  let search=document.getElementById('searchInput').value.toLowerCase();
  let filtered=orders.filter(o=>{
    if(filter!=='all'&&o.status!==filter) return false;
    if(typeFilter==='single'&&o.isCart) return false;
    if(typeFilter==='multi'&&!o.isCart &&!(o.items&&o.items.length>0)) return false;
    if(search){
      let hay = (o.id||'').toLowerCase().includes(search) ||
                (o.title||'').toLowerCase().includes(search) ||
                (o.dungeons||'').toLowerCase().includes(search) ||
                (o.buyerEmail||o.customer?.btag||'').toLowerCase().includes(search) ||
                (o.buyerName||o.customer?.charName||'').toLowerCase().includes(search) ||
                (o.customer?.btag||'').toLowerCase().includes(search) ||
                (o.customer?.contactPhone||'').toLowerCase().includes(search) ||
                (o.items && o.items.some(it=> (it.dungeons||it.title||'').toLowerCase().includes(search))) ||
                (o.isCart&&'multi canasta'.includes(search));
      if(!hay) return false;
    }
    return true;
  });

  document.getElementById('totalOrders').innerText=orders.length;
  document.getElementById('pendingOrders').innerText=orders.filter(o=>o.status==='PENDING_VERIFICATION'||o.status==='PENDING').length;
  document.getElementById('verifiedOrders').innerText=orders.filter(o=>o.status==='PAID_VERIFIED'||o.status==='PAID'||o.status==='VERIFIED').length;
  document.getElementById('progressOrders').innerText=orders.filter(o=>o.status==='IN_PROGRESS').length;
  document.getElementById('completedOrders').innerText=orders.filter(o=>o.status==='COMPLETED').length;
  let total=orders.filter(o=>!['CANCELLED','REFUNDED','REJECTED'].includes(o.status)).reduce((s,o)=>s+(parseFloat(o.usd||o.price||o.total||0)||0),0);
  document.getElementById('totalSales').innerText='$'+total.toFixed(2);

  let container=document.getElementById('ordersContainer');
  if(filtered.length===0){container.innerHTML='';document.getElementById('emptyMsg').style.display='block';return;}
  document.getElementById('emptyMsg').style.display='none';

  container.innerHTML=filtered.map(o=>{
    let idx=getOrders().findIndex(x=>x.id===o.id);
    let num=getOrders().length-idx;
    let cfg=STATUS_CONFIG[o.status]||STATUS_CONFIG.PENDING_VERIFICATION;
    let isMulti=o.isCart || (o.items&&o.items.length>1);
    let img=o.isCart && o.items && o.items[0] && o.items[0].img? o.items[0].img : (o.image||mainImg);
    let cName=o.customer?.charName||o.buyerName||'Guest';
    let cRealm=o.customer?.realm||'';
    let cBtag=o.customer?.btag||o.buyerEmail||'';
    let cPhone=o.customer?.contactPhone||'';

    let dungeonsBlock = '';
    if(o.dungeons){
      let countD = o.dungeonList? o.dungeonList.length : (o.dungeonIds? o.dungeonIds.length : '');
      dungeonsBlock = `
        <div class="mt-2 bg-[#0a0e28] border border-[#8b5cf6]/40 rounded-lg p-2">
          <div class="text-[8px] text-[#8b5cf6] font-black mb-1">&#x1F5FA;&#xFE0F; DUNGEONS SELECCIONADAS ${countD? '('+countD+')' : ''}:</div>
          <div class="text-[11px] text-[#22c55e] font-bold leading-[1.3]">${o.dungeons}</div>
          ${o.tier?`<div class="text-[8px] text-[#8b92c9] mt-1">Tier: ${o.tier.toUpperCase()} ${o.traders?`| Traders: ${o.traders}`:''} ${o.keys||o.level?`| Keys: ${o.keys||o.level}`:''} | Mode: ${o.mode||''}</div>`:''}
        </div>`;
    }

    let multiProductsBlock = '';
    if(isMulti && o.items && o.items.length>0){
      multiProductsBlock = `
        <div class="mt-2 bg-[#0a0e28] border border-[#8b5cf6]/50 rounded-lg p-2">
          <div class="text-[8px] text-[#8b5cf6] font-bold mb-1">&#x1F4E6; Productos en esta canasta MULTI x${o.items.length}:</div>
          ${o.items.map(it=>`<div class="text-[10px] text-[#c2c8e8] border-b border-[#1e254a] py-1 last:border-0">
            ${it.dungeons? '&#x1F5FA;&#xFE0F; <span class="text-[#22c55e] font-bold">'+it.dungeons+'</span> | ' : ''}&#x2022; ${it.title||it.name} ${it.tier? '('+it.tier+')' : ''} ${it.traders? it.traders+' traders':''} | ${it.mode||''} | ${it.keys||it.level? 'Keys: '+(it.keys||it.level)+' | ':''}${it.symbol||'$'}${it.price}
          </div>`).join('')}
        </div>`;
    }

    return `
    <div class="bg-[#151a40] border ${isMulti?'border-[#8b5cf6] border-2':'border-[#2a3366]'} rounded-2xl p-4">
      <div class="flex gap-4 items-start">
        <div class="text-center min-w-[55px]">
          <div class="text-[9px] text-[#8b92c9]">ORDEN</div>
          <div class="text-[18px] font-black">#${num}</div>
          <div class="text-[7px] bg-[#0a0e28] border border-[#2a3366] rounded px-1 mt-1 break-all">${o.id}</div>
          ${isMulti?`<div class="text-[7px] bg-[#8b5cf6] text-white px-2 py-0.5 rounded-full mt-1 font-black">&#x1F6D2; MULTI x${o.count||o.items?.length}</div>`:''}
        </div>
        <img src="${img}" onerror="this.src='./imagenes/favicon.jpg'" class="w-[65px] h-[65px] rounded-xl object-cover border border-[#2a3366]">
        <div class="flex-1">
          <div class="font-black text-[13px]">${isMulti?`&#x1F6D2; Canasta ${o.count||o.items?.length} productos - ${o.title}`:o.title||'Mythic+ Bundle'} ${isMulti?'<span class="text-[9px] bg-[#8b5cf6] px-2 py-0.5 rounded-full ml-2">CANASTA UNICA</span>':''}</div>
          <div class="text-[10px] text-[#8b92c9] mt-1">+${o.level||o.keys||10} ${o.bundle?'x'+o.bundle:''} | ${o.mode||'self'} | ${o.method||'PayPal'} | $${o.usd||o.price||o.total} USD ${o.tier?`| ${o.tier}`:''}</div>
          <div class="mt-2 bg-[#0a0e28] border border-yellow-500/30 rounded-lg p-2">
            <div class="text-[11px] text-yellow-400 font-black">&#x1F464; ${cName} ${cRealm?'- '+cRealm:''}</div>
            <div class="text-[10px] text-[#c2c8e8]">&#x1F48E; ${cBtag} ${cPhone?'| &#x1F4F1; '+cPhone:''}</div>
          </div>
          ${multiProductsBlock}
          ${dungeonsBlock}
          <div class="mt-2 flex gap-2 items-center flex-wrap">
            <span class="text-[11px] font-black bg-[#0a0e28] border border-[#2a3366] px-2 py-1 rounded-full">${o.symbol||'$'}${o.price||o.total||o.usd} ${o.currency||'USD'}</span>
            <span class="text-[9px] px-2 py-1 rounded-full font-bold ${cfg.color}">${cfg.dot} ${cfg.label}</span>
          </div>
          <div class="text-[8px] text-[#6b77b5] mt-1">📅 ${o.date}</div>
        </div>
        <div class="flex flex-col gap-1 min-w-[125px]">
          <select onchange="changeStatus(${idx},this.value)" class="bg-[#0a0e28] border border-[#2a3366] rounded-lg px-2 py-2 text-[10px] font-bold">
            <option value="">Cambiar estado...</option>
            <option value="PENDING_VERIFICATION">&#x1F7E1; Pendiente</option>
            <option value="PAID_VERIFIED">&#x1F7E2; Verificado</option>
            <option value="VERIFIED">✅ VERIFIED TG</option>
            <option value="IN_PROGRESS">&#x1F535; En Progreso</option>
            <option value="COMPLETED">✅ Completado</option>
            <option value="DELAYED">🟠 Retrasado</option>
            <option value="CANCELLED">&#x1F534; Cancelado</option>
            <option value="REJECTED">❌ Rechazado</option>
            <option value="REFUNDED">⚫ Reembolsado</option>
          </select>
          <div class="grid grid-cols-2 gap-1">
            <button onclick="quickStatus(${idx},'PAID_VERIFIED')" class="bg-[#22c55e] text-black py-1.5 rounded text-[9px] font-black">✅ Verificar</button>
            <button onclick="quickStatus(${idx},'IN_PROGRESS')" class="bg-[#3b82f6] text-white py-1.5 rounded text-[9px] font-bold">&#x1F535; Curso</button>
            <button onclick="quickStatus(${idx},'COMPLETED')" class="bg-[#a855f7] text-white py-1.5 rounded text-[9px] font-bold">✅ Listo</button>
            <button onclick="quickStatus(${idx},'DELAYED')" class="bg-[#f97316] text-black py-1.5 rounded text-[9px] font-bold">🟠 Retraso</button>
          </div>
          <button onclick="copySimpleOrder(${idx})" class="bg-[#8b5cf6] text-white py-2 rounded-lg text-[9px] font-black">&#x1F4CB; Copy Orden</button>
          <button onclick="copyFullOrder(${idx})" class="bg-[#1a204f] border border-[#8b5cf6] py-2 rounded-lg text-[8px] font-bold">&#x1F4CB; Copy FULL con precio + dungeons + cliente</button>
          <button onclick="del(${idx})" class="bg-[#ef4444]/20 border border-[#ef4444] text-[#ef4444] py-1.5 rounded text-[9px] font-bold">&#x1F5D1;️ Borrar KV</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function changeStatus(i,newStatus){
  if(!newStatus) return;
  let orders=getOrders();
  let oldStatus=orders[i].status;
  if(oldStatus===newStatus) return;
  if(!orders[i].status_history) orders[i].status_history=[];
  orders[i].status_history.push({status:oldStatus,date:new Date().toLocaleString()});
  orders[i].status=newStatus;
  orders[i].last_update=new Date().toLocaleString();
  if((newStatus==='PAID_VERIFIED'||newStatus==='VERIFIED')&&!orders[i].verified_date) orders[i].verified_date=new Date().toLocaleString();
  await fetch(`${WORKER_URL}/api/order`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...orders[i], _noNotify:true})});
  renderOrders();
}
function quickStatus(i,s){ changeStatus(i,s); }

function copySimpleOrder(i){
  let o=getOrders()[i];
  let txt=`${o.id} - ${o.title}\nDUNGEONS: ${o.dungeons||(o.items?o.items.map(it=>it.dungeons).join(', '):'FULL')}\nCliente: ${o.customer?.charName||o.buyerName||''} ${o.customer?.realm||''} ${o.customer?.btag||o.buyerEmail||''} ${o.customer?.contactPhone||''}\nStatus: ${o.status}`;
  navigator.clipboard.writeText(txt);
  alert('✅ Copiado:\n'+txt);
}
function copyFullOrder(i){
  let o=getOrders()[i];
  let dungeonsFull = o.dungeons || (o.items? o.items.map(it=>`${it.title||it.name}: ${it.dungeons} [${it.tier||''} ${it.traders||''} traders ${it.keys||it.level||''}]`).join(' | ') : 'FULL');
  let txt=`${o.id} - ${o.title} = ${o.symbol||'$'}${o.price||o.total} ${o.currency||'USD'} ($${o.usd||o.price||o.total} USD)\nCliente: ${o.customer?.charName||o.buyerName||''} ${o.customer?.realm||''} - ${o.customer?.btag||o.buyerEmail||''} ${o.customer?.contactPhone||''}\nDUNGEONS: ${dungeonsFull}\nStatus: ${o.status}\n${o.isCart? `CANASTA x${o.items?.length}: ${o.items?.map(it=>it.title+' $'+it.price+' '+it.dungeons).join(' | ')}` : ''}`;
  navigator.clipboard.writeText(txt);
  alert('✅ FULL copiado con dungeons + cliente + precio');
}

async function del(i){
  let o = getOrders()[i];
  if(!o ||!o.id) return;
  let id = o.id;
  if(!confirm('¿Borrar PERMANENTE '+id+' del KV? No volverá.')) return;
  document.getElementById('kvStatus').innerText="&#x1F5D1;️ Borrando "+id+"...";
  try{
    await fetch(`${WORKER_URL}/api/order?id=${encodeURIComponent(id)}`,{method:"DELETE"});
    await fetch(`${WORKER_URL}/api/order?order_id=${encodeURIComponent(id)}`,{method:"DELETE"});
    allOrdersCache = allOrdersCache.filter(x=>x.id!==id);
    renderOrders();
    document.getElementById('kvStatus').innerText=`&#x1F5D1;️ Borrado: ${id}`;
    showToastReal('&#x1F5D1;️ Borrada KV: '+id);
  }catch(e){
    document.getElementById('kvStatus').innerText="❌ Error borrando";
    showToastReal('❌ Error: '+e.message);
  }
}

async function clearAllKV(){
  if(!confirm('¿BORRAR TODAS las órdenes del Cloudflare KV?')) return;
  if(!confirm('Confirmación final - ¿Seguro?')) return;
  document.getElementById('kvStatus').innerText="⏳ Borrando todo KV...";
  try{
    await fetch(`${WORKER_URL}/api/orders`,{method:"DELETE"});
    allOrdersCache=[];
    renderOrders();
    document.getElementById('kvStatus').innerText='✅ KV Limpio';
    showToastReal('✅ KV Limpiado - ya no volverán');
  }catch(e){
    showToastReal('❌ Error: '+e.message);
  }
}
function showToastReal(m){
  let div=document.createElement('div');
  div.innerText=m;
  div.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ef4444;color:white;padding:12px 24px;border-radius:30px;font-weight:900;z-index:999';
  document.body.appendChild(div);
  setTimeout(()=>div.remove(),2500);
}
function exportOrders(){
  let orders=getOrders(); let csv='Num,ID,Titulo,Dungeons,Tier,Traders,Precio,USD,Cliente,Realm,BTag,Telefono,Fecha,Estado,Tipo\n';
  orders.forEach((o,i)=>{ let num=orders.length-i; let dungs = (o.dungeons||'').replace(/"/g,'""'); csv+=`${num},${o.id},"${(o.title||'').replace(/"/g,'""')}","${dungs}","${o.tier||''}","${o.traders||''}",${o.price||o.total},${o.usd||o.price||o.total},"${o.customer?.charName||o.buyerName||''}","${o.customer?.realm||''}","${o.customer?.btag||o.buyerEmail||''}","${o.customer?.contactPhone||''}","${o.date}",${o.status},${o.isCart?'MULTI':'SINGLE'}\n`; });
  let blob=new Blob([csv],{type:'text/csv'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='ordenes_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}
loadAllOrders();
setInterval(loadAllOrders,15000);
</script>
<script src="./global-search.js"></script>
<script src="./gh-banner.js"></script>
<script src="./chat-widget.js"></script>
</body>
</html>
