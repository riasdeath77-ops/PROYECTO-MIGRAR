<script>
const AUTH_WORKER = "https://silent-term-1b1a.riasdeath77.workers.dev";
function showToast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function getUnifiedCart(){
 let main=[]; try{ main=JSON.parse(localStorage.getItem('gearhaven_cart')||'[]'); }catch{}
 if(Array.isArray(main) && main.length>0) return main;
 let unified=[];
 for(let i=0;i<localStorage.length;i++){
   let k=localStorage.key(i);
   if(k && k.toLowerCase().includes('cart') && k!=='gearhaven_cart' && k!=='gh_cart_total' && k!=='gh_cart_code'){
     try{ let arr=JSON.parse(localStorage.getItem(k)); if(Array.isArray(arr)&&arr.length>0) unified=unified.concat(arr); }catch{}
   }
 }
 if(unified.length>0){
   localStorage.setItem('gearhaven_cart', JSON.stringify(unified));
   for(let i=localStorage.length-1;i>=0;i--){
     let k=localStorage.key(i);
     if(k && k.toLowerCase().includes('cart') && k!=='gearhaven_cart' && k!=='gh_cart_total' && k!=='gh_cart_code' && k!=='gh_last_order'){
       localStorage.removeItem(k);
     }
   }
 }
 return unified;
}
function syncAllCarts(cart){
 localStorage.setItem('gearhaven_cart', JSON.stringify(cart));
 for(let i=localStorage.length-1;i>=0;i--){
   let k=localStorage.key(i);
   if(k && k.toLowerCase().includes('cart') && k!=='gearhaven_cart' && k!=='gh_cart_total' && k!=='gh_cart_code' && k!=='gh_last_order'){
     localStorage.removeItem(k);
   }
 }
}

const DUNGEON_MAP = {
  altar:'Altar of Fangs', murder:'Murder Row', den:'Den of Nalorakk',
  vale:'The Blinding Vale', voidscar:'Voidscar Arena', kings:"Kings' Rest",
  temple:'Temple of Sethraliss', ruby:'Ruby Life Pools'
};
function resolveDungeonName(raw){
  if(!raw) return 'Any Dungeon';
  let s = Array.isArray(raw)? raw.join(', ') : String(raw);
  s = s.trim();
  if(!s) return 'Any Dungeon';
  let low = s.toLowerCase();
  if(low === 'any' || low === 'any dungeon' || low.includes('any +10')) return 'Any Dungeon';
  if(s.length > 25 || s.includes(' of ') || s.includes('Rest') || s.includes('Row')){
    return s;
  }
  return s.split(',').map(k=>{
    let key = k.trim().toLowerCase();
    return DUNGEON_MAP[key] || k.trim();
  }).filter(Boolean).join(', ');
}

function normalizeItem(item){
 if(!item) return null;
 let raw = item.price?? item.usd?? item.total?? item.amount?? 0;
 let price = parseFloat(String(raw).toString().replace(/[^0-9.]/g,''))||0;
 if(price===0 && item.raw?.price) price = parseFloat(item.raw.price)||0;
 let name = item.name || item.title || 'Mythic Bundle';
 let dungeonRaw = item.dungeonNames || item.dungeons || 'Any Dungeon';
 let dungeonStr = resolveDungeonName(dungeonRaw);
 let traders = item.traders || item.bundle || 2;
 let tradersLabel = traders>2? `${traders} traders` : '2 traders (free)';
 let server = item.playMode || item.mode || 'SELFPLAY';
 let character = item.character || 'Dungeon Pack';
 let imgHtml = item.img? `<img src="${item.img}">` : '🏰';
 return {name, price, server, character, imgHtml, dungeonStr, tradersLabel, raw:item, traders};
}
function loadCart(){
 let rawCart = getUnifiedCart();
 let cart = rawCart.map(normalizeItem).filter(Boolean);
 let list=document.getElementById('cartList');
 let total = cart.reduce((s,i)=>s+i.price,0);
 if(cart.length===0){
   list.innerHTML='';document.getElementById('totalBox').style.display='none';
   document.getElementById('emptyBox').style.display='block';
   document.getElementById('count').innerText='0';document.getElementById('count2').innerText='0';return;
 }
 document.getElementById('totalBox').style.display='block';document.getElementById('emptyBox').style.display='none';
 document.getElementById('count').innerText=cart.length;document.getElementById('count2').innerText=cart.length;
 let savedCode = localStorage.getItem('gh_cart_code');
 if(!savedCode){ savedCode='GH-'+Math.random().toString(36).substr(2,4).toUpperCase()+'-MULTI'; localStorage.setItem('gh_cart_code', savedCode); }
 document.getElementById('codePreview').innerHTML='🪙 1 single order - Code '+savedCode;
 list.innerHTML=cart.map((n, idx)=>`
  <div class="glass rounded-[16px] p-4 flex gap-4 items-start">
    <div class="icon-dungeon">${n.imgHtml}</div>
    <div class="flex-1 min-w-0">
      <span class="text-[9px] font-black px-2 py-1 rounded-full border bg-[#0a0e28] border-[#8b5cf6]/30 text-[#a78bfa]">🏰 ${n.server.toUpperCase()}</span>
      <div class="font-black text-[13px] mt-1.5">${n.name}</div>
      <div class="text-[10px] text-[#a0a8d0] mt-1">👤 ${n.character}</div>
      <div class="mt-2 flex flex-wrap gap-1">${n.dungeonStr.split(',').map(d=>`<span class="text-[8px] bg-[#0a0e28] border border-[#8b5cf6]/40 px-2 py-1 rounded-full text-[#22c55e] font-bold">🗺️ ${d.trim()}</span>`).join('')}</div>
      <div class="mt-1 text-[9px] text-white/40">👥 ${n.tradersLabel}</div>
    </div>
    <div class="text-right">
      <div class="font-black text-[14px] text-[#fbbf24]">$${n.price.toFixed(2)}</div>
      <button onclick="removeItem(${idx})" class="mt-1 text-[9px] bg-white/5 border border-white/10 px-2 py-1 rounded-full">✕ Remove</button>
    </div>
  </div>`).join('');
 document.getElementById('totalUSD').innerText=total.toFixed(2);
 document.getElementById('totalMain').innerText=total.toFixed(2);
 localStorage.setItem('gh_cart_total', total.toFixed(2));
}
function removeItem(i){ let raw=getUnifiedCart(); raw.splice(i,1); syncAllCarts(raw); if(raw.length===0) localStorage.removeItem('gh_cart_code'); loadCart(); showToast('🗑️ Removed'); }
function clearAllCarts(){ if(!confirm('Clear all?')) return; for(let i=localStorage.length-1;i>=0;i--){ let k=localStorage.key(i); if(k && k.toLowerCase().includes('cart')){ localStorage.removeItem(k); } } localStorage.removeItem('gh_last_order'); localStorage.removeItem('gh_cart_total'); localStorage.removeItem('gh_cart_code'); loadCart(); showToast('🗑️ Cleared'); }

function goCheckout(){
 let raw=getUnifiedCart(); if(raw.length===0){showToast('Cart empty');return;}
 let fixedRaw = raw.map(r=>{
   return {...r, dungeonNames: resolveDungeonName(r.dungeonNames||r.dungeons), dungeons: resolveDungeonName(r.dungeons||r.dungeonNames), price: parseFloat(String(r.price||r.usd||0).replace(/[^0-9.]/g,''))||0 };
 });
 let total = fixedRaw.reduce((s,i)=>s+parseFloat(i.price||0),0);
 let code = localStorage.getItem('gh_cart_code')||'GH-MULTI';
 let dungeonsAll = fixedRaw.map(r=>r.dungeonNames).join(' | ');
 const orderId = 'GH-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substr(2,3).toUpperCase();
 const fullOrder = {
   id: orderId,
   code: code,
   total: total.toFixed(2),
   price: total.toFixed(2),
   status: 'PENDING',
   method: 'cart_checkout',
   date: new Date().toISOString(),
   title: fixedRaw.length>1? `Cart (${fixedRaw.length} items)` : (fixedRaw[0]?.name||fixedRaw[0]?.title||'Mythic Bundle'),
   items: fixedRaw,
   dungeons: dungeonsAll,
   customer: JSON.parse(localStorage.getItem('gearhaven_current_user')||'{}')
 };

 localStorage.setItem('gh_last_order', JSON.stringify(fullOrder));
 localStorage.setItem('gh_last_order_id', orderId);
 syncAllCarts(fixedRaw);

 // === NUEVO: GUARDAR EN CLOUDFLARE D1 ===
 const sess = localStorage.getItem('gearhaven_session');
 if(sess){
   fetch(`${AUTH_WORKER}/api/orders`, {
     method:'POST',
     headers:{'Content-Type':'application/json','Authorization':`Bearer ${sess}`},
     body: JSON.stringify({ order: fullOrder })
   }).then(r=>r.json()).then(d=> console.log('✅ Order saved to D1:', d)).catch(e=> console.log('D1 save pending, will retry at checkout', e));
 }

 location.href=`./checkout.html?is_cart=1&cart_total=${total.toFixed(2)}&cart_usd=${total.toFixed(2)}&count=${fixedRaw.length}&code=${code}&id=${orderId}&dungeons=${encodeURIComponent(dungeonsAll)}`;
}
loadCart();
</script>
