<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Booster Dashboard</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0e28;color:#fff;font-family:Inter}</style></head><body>
<header class="flex justify-between p-4 bg-[#0f1333] border-b border-[#212a5c]"><div class="font-black">GEAR<span class="text-[#8b5cf6]">HAVEN</span> BOOSTER</div><div id="email" class="text-[11px] bg-[#111536] border px-3 py-2 rounded-full">...</div></header>
<div id="loading" class="p-20 text-center">Cargando...</div>
<div id="panel" class="hidden max-w-[800px] mx-auto p-6">
<div class="grid md:grid-cols-2 gap-4">
<div class="bg-[#111536] border border-[#212a5c] rounded-xl p-6"><div class="text-[10px] text-[#8b92c9]">BALANCE DISPONIBLE</div><div id="balance" class="text-[36px] font-black text-[#4ade80]">$0.00</div><div class="text-[11px] text-[#8b92c9] mt-1">Total ganado: <span id="total">$0</span></div><button onclick="requestPay()" class="mt-4 w-full bg-[#8b5cf6] py-3 rounded-full font-black text-[13px]">💸 Solicitar Retiro</button><div class="text-[10px] text-[#8b92c9] mt-2 text-center">Mínimo $20 • Pagos Lunes/Jueves • PayPal/USDT/Zelle/PayPhone/Crypto</div></div>
<div class="bg-[#111536] border border-[#212a5c] rounded-xl p-6"><div class="text-[10px] text-[#8b92c9] mb-3">MI MÉTODO DE PAGO</div><div class="text-[11px] text-[#8b92c9]">Método actual: <span id="currentPay" class="text-white font-bold">-</span></div><select id="payMethod" class="mt-3 w-full bg-[#0a0e28] border border-[#2a3366] rounded-xl px-3 py-3 text-[13px]"><option>PayPal</option><option>USDT</option><option>Zelle</option><option>PayPhone</option><option>Crypto</option></select><input id="payAccount" placeholder="paypal@email.com / wallet / 099..." class="mt-3 w-full bg-[#0a0e28] border border-[#2a3366] rounded-xl px-3 py-3 text-[13px]"><button onclick="savePay()" class="mt-3 w-full bg-[#1a204f] border border-[#2a3366] py-2 rounded-full font-bold text-[12px]">Guardar método</button><div class="mt-4 text-[10px] text-[#8b92c9]">Telegram ID vinculado: <span id="tg" class="text-white">-</span></div></div>
</div>
<div class="mt-6 bg-[#111536] border border-[#212a5c] rounded-xl p-4"><h3 class="font-black text-[14px] mb-3">Mis Órdenes</h3><table class="w-full text-[12px]"><thead><tr class="text-[10px] text-[#8b92c9] border-b"><th class="text-left p-2">ID</th><th class="text-left p-2">$</th><th class="text-left p-2">Estado</th><th class="p-2">Acción</th></tr></thead><tbody id="orders"></tbody></table></div>
</div>
<script>
const WORKER="https://silent-term-1b1a.riasdeath77.workers.dev";
function getSession(){return localStorage.getItem("gearhaven_session")||new URLSearchParams(location.hash.slice(1)).get("session");}
async function init(){let token=getSession();if(!token){document.getElementById("loading").innerHTML='Logueate en account.html primero';return;}try{let r=await fetch(WORKER+"/api/session",{headers:{Authorization:"Bearer "+token}});let d=await r.json();if(!d.logged){document.getElementById("loading").innerHTML='No logueado';return;}document.getElementById("email").innerText=d.user.email;load(token);}catch(e){document.getElementById("loading").innerHTML=e.message;}}
async function load(token){let r=await fetch(WORKER+"/api/booster/me?token="+encodeURIComponent(token));let j=await r.json();if(!r.ok){document.getElementById("loading").innerHTML=j.error;return;}document.getElementById("loading").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");document.getElementById("balance").innerText="$"+(j.account.balance||0).toFixed(2);document.getElementById("total").innerText="$"+(j.account.total_earned||0).toFixed(2);document.getElementById("currentPay").innerText=j.account.payout_method+" - "+j.account.payout_account;document.getElementById("tg").innerText=j.account.telegram_id||"No vinculado";document.getElementById("payAccount").value=j.account.payout_account||"";let ro=await fetch(WORKER+"/api/booster/orders?token="+encodeURIComponent(token));let jo=await ro.json();let tbody=document.getElementById("orders");if(!jo.orders||jo.orders.length==0){tbody.innerHTML='<tr><td colspan="4" class="p-6 text-center text-[#8b92c9]">Sin órdenes. Acepta una en Telegram.</td></tr>';return;}tbody.innerHTML=jo.orders.map(o=>`<tr class="border-b border-[#1e254a]/30"><td class="p-2 font-bold">${o.id}</td><td class="p-2">$${o.amount.toFixed(2)}</td><td class="p-2"><span class="text-[10px] px-2 py-1 rounded-full ${o.status==='IN_PROGRESS'?'bg-[#3f2e0e] text-[#facc15]':'bg-[#132a1f] text-[#4ade80]'}">${o.status}</span></td><td class="p-2 text-center">${o.status==='IN_PROGRESS'?`<button onclick="done('${o.id}')" class="bg-[#22c55e] text-black px-3 py-1 rounded-full text-[11px] font-black">DONE</button>`:'✔️'}</td></tr>`).join('');}
async function done(id){if(!confirm("¿Terminaste "+id+"?"))return;let token=getSession();let r=await fetch(WORKER+"/api/booster/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,orderId:id})});let j=await r.json();if(!r.ok)return alert(j.error);alert("✅ $"+j.new_balance.toFixed(2));load(token);}
async function savePay(){let method=document.getElementById("payMethod").value;let account=document.getElementById("payAccount").value.trim();if(!account)return alert("Pon tu cuenta");let token=getSession();let r=await fetch(WORKER+"/api/booster/payout-method",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,method,account})});let j=await r.json();if(!r.ok)return alert(j.error);alert("✅ Guardado");}
function requestPay(){let bal=document.getElementById("balance").innerText;let pay=document.getElementById("currentPay").innerText;window.open("https://t.me/GearHavenSupport?text="+encodeURIComponent("Hola, quiero retirar "+bal+" Método: "+pay)," _blank");}
init();
</script></body></html>
